<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" font-family="system-ui,Segoe UI,Arial,sans-serif"><title>Example mockup: the Windows safety check with More info and Run anyway</title><rect width="480" height="300" fill="#0f0c08"/>
<rect x="90" y="30" width="300" height="240" fill="#1c3f78" stroke="#4a78c0"/>
<text x="110" y="75" font-size="17" font-weight="700" fill="#fff">Windows protected your PC</text>
<text x="110" y="105" font-size="11" fill="#dbe6fa">Windows stopped an unrecognized app</text><text x="110" y="121" font-size="11" fill="#dbe6fa">from starting.</text>
<text x="110" y="150" font-size="12" fill="#fff" text-decoration="underline">More info</text>
<rect x="110" y="196" width="100" height="32" fill="#fff"/><text x="122" y="217" font-size="12" font-weight="700" fill="#1c3f78">Run anyway</text>
<rect x="222" y="196" width="100" height="32" fill="none" stroke="#fff"/><text x="248" y="217" font-size="12" fill="#fff">Don't run</text>
<path d="M165 175 v14 m-6 -6 l6 7 l6 -7" stroke="#e0b24a" stroke-width="3" fill="none"/>
<text x="20" y="290" font-size="10" fill="#8f856f">Example only. Your Windows may look a little different.</text>
</svg>
