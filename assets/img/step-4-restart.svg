<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" font-family="system-ui,Segoe UI,Arial,sans-serif"><title>Example mockup: the game's addon list showing WoW Companion switched on</title><rect width="480" height="300" fill="#0f0c08"/>
<rect x="60" y="20" width="360" height="260" rx="8" fill="#1d1812" stroke="#e0b24a" stroke-width="1.5"/><rect x="60" y="20" width="360" height="26" rx="8" fill="#2b2418"/><text x="72" y="38" font-size="13" font-weight="700" fill="#e0b24a" font-family="Georgia,serif">AddOns (example)</text>
<g font-size="12" fill="#efe6d2">
<rect x="80" y="62" width="320" height="30" fill="#262017"/><rect x="88" y="70" width="14" height="14" fill="#14110c" stroke="#e0b24a"/><path d="M90 77 l4 4 l7 -9" stroke="#e0b24a" stroke-width="2" fill="none"/><text x="112" y="82">WoW Companion</text>
<rect x="80" y="98" width="320" height="30" fill="#1d1812" stroke="#3a3022"/><rect x="88" y="106" width="14" height="14" fill="#14110c" stroke="#e0b24a"/><path d="M90 113 l4 4 l7 -9" stroke="#e0b24a" stroke-width="2" fill="none"/><text x="112" y="118">WoWCompanion_Digest</text></g>
<text x="80" y="165" font-size="13" fill="#e0b24a" font-weight="700">First time: quit the game fully, then start it.</text>
<text x="80" y="190" font-size="13" fill="#efe6d2">Later: type  /reload  in the game.</text>
<rect x="80" y="210" width="130" height="30" rx="5" fill="#0f0c08" stroke="#3a3022"/><text x="92" y="230" font-size="13" fill="#f0c866" font-family="Consolas,monospace">/reload</text>
</svg>
